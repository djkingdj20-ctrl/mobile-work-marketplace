<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile Work</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#08111f;color:#edf5ff}header{padding:18px 16px;background:#0d1b2d;position:sticky;top:0;z-index:2}h1,h2,h3{margin:0 0 10px}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#102238;border:1px solid #203954;border-radius:16px;padding:16px;margin:12px 0}.muted{color:#9db0c6}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}button,input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #36516d;background:#0b1727;color:#fff;font:inherit}button{background:#20c77a;border:0;color:#03150d;font-weight:700;cursor:pointer}.danger{background:#ef6262;color:white}.secondary{background:#223953;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}img{width:100%;height:170px;object-fit:cover;border-radius:12px}.hidden{display:none}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#17324c;color:#bfe0ff;font-size:12px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.nav button{font-size:13px}.money{font-size:30px;font-weight:800}.msg{padding:10px;border-radius:10px;background:#15354a;margin:10px 0}.err{background:#4a2028}.small{font-size:13px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #28425d;text-align:left;font-size:13px}form{display:grid;gap:10px}</style></head><body><header><div class="wrap row"><div><h1>📱 Mobile Work</h1><div class="muted small">Work from your phone</div></div><div id="topUser"></div></div></header><main class="wrap"><section id="auth"><div class="card"><h2>Login</h2><form id="login"><input id="le" type="email" placeholder="Email" required><input id="lp" type="password" placeholder="Password" required><button>Login</button></form><div id="loginMsg"></div></div><div class="card"><h2>Create account</h2><form id="register"><input id="rn" placeholder="Name" required><input id="re" type="email" placeholder="Email" required><input id="rp" type="password" placeholder="Password (6+ characters)" required><button>Register</button></form><div id="regMsg"></div></div></section><section id="app" class="hidden"><div class="nav"><button onclick="show('home')">Home</button><button onclick="show('work')">Work</button><button onclick="show('wallet')">Wallet</button><button onclick="show('more')">More</button></div><div id="home"></div><div id="work" class="hidden"></div><div id="wallet" class="hidden"></div><div id="more" class="hidden"></div></section></main><script>
let token=localStorage.getItem("mw_token"),me=null;const $=x=>document.getElementById(x);async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};if(opt.body&&typeof opt.body!=="string"){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(opt.body)}const r=await fetch(url,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"Request failed");return j}
function msg(el,t,e=false){$(el).innerHTML='<div class="msg '+(e?"err":"")+'">'+t+"</div>"}
$("login").onsubmit=async e=>{e.preventDefault();try{let j=await api("/api/login",{method:"POST",body:{email:$("le").value,password:$("lp").value}});token=j.token;localStorage.setItem("mw_token",token);await start()}catch(x){msg("loginMsg",x.message,true)}};
$("register").onsubmit=async e=>{e.preventDefault();try{let j=await api("/api/register",{method:"POST",body:{name:$("rn").value,email:$("re").value,password:$("rp").value}});token=j.token;localStorage.setItem("mw_token",token);await start()}catch(x){msg("regMsg",x.message,true)}};
async function start(){try{me=(await api("/api/me")).user;$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("topUser").innerHTML="Hi, "+me.name.split(" ")[0];show("home")}catch(e){logout()}}
function logout(){token=null;localStorage.removeItem("mw_token");location.reload()}
function show(id){["home","work","wallet","more"].forEach(x=>$(x).classList.toggle("hidden",x!==id));if(id==="home")home();if(id==="work")work();if(id==="wallet")wallet();if(id==="more")more()}
async function home(){me=(await api("/api/me")).user;$("home").innerHTML='<div class="card"><div class="muted">Available balance</div><div class="money">₹'+me.balance+'</div><div class="muted small">Points are shown as ₹ value in this MVP.</div></div><div class="card"><h2>Start earning</h2><p class="muted">Complete available verification work. Rewards are added after admin approval.</p><button onclick="show(\'work\')">View work</button></div>'}
async function work(){let j=await api("/api/tasks");$("work").innerHTML="<h2>Available Work</h2>"+(j.tasks.length?'<div class="grid">'+j.tasks.map(t=>'<div class="card"><img src="'+t.imageUrl+'"><span class="pill">'+t.source+'</span><h3>'+esc(t.title)+'</h3><p class="muted">'+esc(t.description)+'</p><div class="row"><b>₹'+t.reward+'</b><button style="width:auto" onclick="submitTask(\''+t.id+'\')">Submit</button></div></div>').join("")+"</div>":"<div class=card>No tasks available right now.</div>")}
async function submitTask(tid){let a=prompt("Enter your answer: YES or NO");if(!a)return;try{await api("/api/tasks/"+tid+"/submit",{method:"POST",body:{answer:a}});alert("Submitted for admin review.");work()}catch(e){alert(e.message)}}
async function wallet(){me=(await api("/api/me")).user;let s=await api("/api/submissions");$("wallet").innerHTML='<div class="card"><h2>Wallet</h2><div class="money">₹'+me.balance+'</div><p class="muted">Minimum withdrawal: ₹100</p><button onclick="withdraw()">Request withdrawal</button></div><div class="card"><h3>My submissions</h3>'+((s.submissions||[]).map(x=>'<p><b>'+esc(x.taskTitle)+'</b> — ₹'+x.reward+' — <span class=pill>'+x.status+'</span></p>').join("")||"<p class=muted>No submissions yet.</p>")+"</div>"}
async function withdraw(){let a=prompt("Withdrawal amount (minimum 100):");if(a===null)return;try{await api("/api/withdraw",{method:"POST",body:{amount:Number(a)}});alert("Withdrawal request created.");wallet()}catch(e){alert(e.message)}}
function more(){if(me.role==="admin")admin();else $("more").innerHTML='<div class="card"><h2>Business</h2><p class="muted">Businesses can submit work requests for admin review.</p><form id="biz"><input id="bn" placeholder="Business name" required><input id="bt" placeholder="Task title" required><textarea id="bd" placeholder="Task description" required></textarea><input id="br" type="number" min="1" placeholder="Reward per task" required><input id="bc" type="number" min="1" placeholder="Number of tasks" required><button>Send request</button></form><div id="bm"></div></div><div class=card><button class=secondary onclick="logout()">Logout</button></div>';if(me.role!=="admin")$("biz").onsubmit=async e=>{e.preventDefault();try{await api("/api/business/request",{method:"POST",body:{businessName:$("bn").value,title:$("bt").value,description:$("bd").value,reward:Number($("br").value),totalTasks:Number($("bc").value)}});msg("bm","Request sent to admin.")}catch(x){msg("bm",x.message,true)}}}
async function admin(){let [sum,ss,ww,bb]=await Promise.all([api("/api/admin/summary"),api("/api/admin/submissions"),api("/api/admin/withdrawals"),api("/api/admin/business-requests")]);$("more").innerHTML='<div class="card"><h2>Admin Dashboard</h2><div class="grid"><div>Users<br><b>'+sum.users+'</b></div><div>Pending work<br><b>'+sum.submissions+'</b></div><div>Pending withdrawals<br><b>'+sum.withdrawals+'</b></div><div>Business requests<br><b>'+sum.businessRequests+'</b></div></div></div><div class=card><h3>Work reviews</h3>'+ss.submissions.filter(x=>x.status==="pending").map(x=>'<p>'+esc(x.user?.name||"User")+' — '+esc(x.taskTitle)+' — ₹'+x.reward+' <button style="width:auto" onclick="reviewSub(\''+x.id+'\',\'approve\')">Approve</button> <button class=danger style="width:auto" onclick="reviewSub(\''+x.id+'\',\'reject\')">Reject</button></p>').join("")||"<p class=muted>None</p>"+'</div><div class=card><h3>Withdrawals</h3>'+ww.withdrawals.filter(x=>x.status==="pending").map(x=>'<p>'+esc(x.user?.name||"User")+' — ₹'+x.amount+' <button style="width:auto" onclick="reviewW(\''+x.id+'\',\'paid\')">Mark paid</button> <button class=danger style="width:auto" onclick="reviewW(\''+x.id+'\',\'reject\')">Reject</button></p>').join("")||"<p class=muted>None</p>"+'</div><div class=card><h3>Business requests</h3>'+bb.requests.filter(x=>x.status==="pending").map(x=>'<p>'+esc(x.businessName)+' — '+esc(x.title)+' — ₹'+x.reward+' × '+x.totalTasks+' <button style="width:auto" onclick="reviewB(\''+x.id+'\',\'approve\')">Approve</button> <button class=danger style="width:auto" onclick="reviewB(\''+x.id+'\',\'reject\')">Reject</button></p>').join("")||"<p class=muted>None</p>"+'</div><div class=card><button class=secondary onclick="logout()">Logout</button></div>'}
async function reviewSub(id,d){await api("/api/admin/submissions/"+id+"/review",{method:"POST",body:{decision:d}});admin()}async function reviewW(id,d){await api("/api/admin/withdrawals/"+id+"/review",{method:"POST",body:{decision:d}});admin()}async function reviewB(id,d){await api("/api/admin/business-requests/"+id+"/review",{method:"POST",body:{decision:d}});admin()}function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
if(token)start();
</script></body></html>
